<div class="app-tabs" id="appTabs">
  <div class="tab-list" role="tablist" aria-label="AeroTrack sections">
    <button class="tab-button is-active" id="tabBtnFpl" type="button" role="tab" aria-selected="true" aria-controls="tabFpl" data-tab-target="tabFpl">FPL</button>
    <button class="tab-button" id="tabBtnDistances" type="button" role="tab" aria-selected="false" aria-controls="tabDistances" data-tab-target="tabDistances">Live Nav</button>
    <button class="tab-button" id="tabBtnAircraft" type="button" role="tab" aria-selected="false" aria-controls="tabAircraft" data-tab-target="tabAircraft">Traffic Info</button>
    <button class="tab-button" id="tabBtnWaypoints" type="button" role="tab" aria-selected="false" aria-controls="tabWaypoints" data-tab-target="tabWaypoints">Nav Log</button>
  </div>

  <section class="tab-panel is-active" id="tabFpl" role="tabpanel" aria-labelledby="tabBtnFpl">
    <div class="mapboxDetails">
      <div id="md1">
        <h3>FPL data</h3>
        <div class="fpl-field">
          <label for="depAd">DEP</label>
          <input type="text" id="depAd" placeholder="DEP" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>
        <div class="fpl-field">
          <label for="destAd">DEST</label>
          <input type="text" id="destAd" placeholder="DEST" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>
        <div class="fpl-field">
          <label for="etd">ETD</label>
          <input type="text" id="etd" placeholder="ETD" maxlength="4" inputmode="numeric" autocomplete="off" spellcheck="false">
        </div>
        <div class="fpl-field fpl-route-field">
          <label for="fixes">Route</label>
          <input type="text" id="fixes" placeholder="Route" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>
        <details class="icao-fpl-details">
          <summary>ICAO FPL details</summary>
          <div class="icao-fpl-grid">
            <div class="icao-field icao-field-wide">
              <label for="aircraftId"><b>7</b> Aircraft identification</label>
              <input id="aircraftId" type="text" maxlength="7" placeholder="XAABC" autocapitalize="characters" spellcheck="false">
            </div>
            <div class="icao-field">
              <label for="flightRules"><b>8</b> Flight rules</label>
              <select id="flightRules">
                <option value="">—</option><option value="I">I — IFR</option><option value="V">V — VFR</option><option value="Y">Y — IFR/VFR</option><option value="Z">Z — VFR/IFR</option>
              </select>
            </div>
            <div class="icao-field">
              <label for="flightType">Type of flight</label>
              <select id="flightType">
                <option value="">—</option><option value="S">S — Scheduled</option><option value="N">N — Non-scheduled</option><option value="G">G — General aviation</option><option value="M">M — Military</option><option value="X">X — Other</option>
              </select>
            </div>
            <div class="icao-field">
              <label for="aircraftNumber"><b>9</b> Number</label>
              <input id="aircraftNumber" type="text" maxlength="2" inputmode="numeric" placeholder="1">
            </div>
            <div class="icao-field">
              <label for="aircraftType">Aircraft type</label>
              <input id="aircraftType" type="text" maxlength="4" placeholder="C172" autocapitalize="characters" spellcheck="false">
            </div>
            <div class="icao-field">
              <label for="wakeCategory">Wake category</label>
              <select id="wakeCategory">
                <option value="">—</option><option value="L">L — Light</option><option value="M">M — Medium</option><option value="H">H — Heavy</option><option value="J">J — Super</option>
              </select>
            </div>
            <div class="icao-field icao-field-wide">
              <label for="equipment"><b>10</b> Equipment and capabilities</label>
              <input id="equipment" type="text" maxlength="40" placeholder="S/C" autocapitalize="characters" spellcheck="false">
            </div>
            <div class="icao-field">
              <label for="cruisingSpeed"><b>15</b> Cruising speed</label>
              <input id="cruisingSpeed" type="text" maxlength="5" placeholder="N0120" autocapitalize="characters" spellcheck="false">
            </div>
            <div class="icao-field">
              <label for="cruisingLevel">Level</label>
              <input id="cruisingLevel" type="text" maxlength="5" placeholder="A080" autocapitalize="characters" spellcheck="false">
            </div>
            <div class="icao-field">
              <label for="totalEet"><b>16</b> Total EET</label>
              <input id="totalEet" type="text" maxlength="4" inputmode="numeric" placeholder="0130">
            </div>
            <div class="icao-field">
              <label for="alternate1">Alternate</label>
              <input id="alternate1" type="text" maxlength="4" placeholder="MMMM" autocapitalize="characters" spellcheck="false">
            </div>
            <div class="icao-field">
              <label for="alternate2">2nd alternate</label>
              <input id="alternate2" type="text" maxlength="4" placeholder="MMMM" autocapitalize="characters" spellcheck="false">
            </div>
            <div class="icao-field icao-field-full">
              <label for="otherInformation"><b>18</b> Other information</label>
              <textarea id="otherInformation" rows="2" maxlength="320" placeholder="PBN/… REG/… OPR/…"></textarea>
            </div>
            <div class="icao-field">
              <label for="endurance"><b>19</b> Endurance</label>
              <input id="endurance" type="text" maxlength="4" inputmode="numeric" placeholder="0430">
            </div>
            <div class="icao-field">
              <label for="personsOnBoard">Persons on board</label>
              <input id="personsOnBoard" type="text" maxlength="3" inputmode="numeric" placeholder="002">
            </div>
            <div class="icao-field icao-field-wide">
              <label for="aircraftColour">Aircraft colour and markings</label>
              <input id="aircraftColour" type="text" maxlength="80" placeholder="WHITE / BLUE">
            </div>
            <div class="icao-field icao-field-full">
              <label for="fplRemarks">Remarks</label>
              <input id="fplRemarks" type="text" maxlength="120" placeholder="Remarks">
            </div>
            <div class="icao-field icao-field-full">
              <label for="pilotInCommand">Pilot in command</label>
              <input id="pilotInCommand" type="text" maxlength="120" placeholder="Name / licence / address / signature">
            </div>
          </div>
        </details>
        <div id="routeMessages" class="route-messages" aria-live="polite"></div>
        <div id="routeSuggestion" class="route-suggestion" aria-live="polite"></div>
        <div id="routeSummary" class="route-summary" aria-live="polite"></div>
        <div class="fpl-actions">
          <button id="suggestRouteBtn" type="button">Suggest Route</button>
          <button id="buildRouteBtn" type="button">Process FPL</button>
          <button id="zoomToLastFix">Zoom Dest AD</button>
          <button id="exportIcaoFplBtn" class="export-fpl-btn" type="button" title="Preview the official SENEAM/AFAC editable flight-plan form">Preview FPL PDF</button>
          <button id="resetAppBtn" class="reset-app-btn" type="button">Reset App</button>
        </div>
        <h2>DEST AD info</h2>

        <div id="airportInfo">
        </div>
      </div>
    </div>
  </section>

  <section class="tab-panel" id="tabDistances" role="tabpanel" aria-labelledby="tabBtnDistances" hidden>
    <div class="mapboxDetails">
      <div id="md2">
        <h3>Distances data</h3>
        <div id="tableContainer">
          <table id="distanceTable">
            <thead class="thead-light">
              <tr>
                <th>WP</th>
                <th>D- FPL (NM)</th>
                <th>Ttl- D (NM)</th>
                <th>Dct (NM)</th>
              </tr>
            </thead>
            <tbody>
            <!-- Table rows will be added here dynamically -->
            </tbody>
          </table>
        </div><!--finaliza div de table-->
      </div>
    </div>
  </section>

  <section class="tab-panel" id="tabAircraft" role="tabpanel" aria-labelledby="tabBtnAircraft" hidden>
    <div class="mapboxDetails">
      <h3>Selected Flight Info </h3>
      <div id="aircraftDetails" class="details-content">
        <p>Select flight</p>
      </div>
    </div>
  </section>

  <section class="tab-panel" id="tabWaypoints" role="tabpanel" aria-labelledby="tabBtnWaypoints" hidden>
    <div id="lugar">
    </div>
    <p class="pwaypoints">Waypoints</p>
    <table id="fixTable">
      <tr>
        <th>WP</th>
        <th>Lat</th>
        <th>Long</th>
      </tr>
      <!-- Rows will be added here -->
    </table>
  </section>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js?v=20261117c')
      .then(reg => {
        console.log('Service Worker registered:', reg.scope);
        reg.update();
      })
      .catch(err => console.error('Service Worker registration failed:', err));

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (sessionStorage.getItem('aerotrack-sw-refresh') === 'pending') {
        return;
      }
      sessionStorage.setItem('aerotrack-sw-refresh', 'pending');
      window.location.reload();
    });
  }
</script>
