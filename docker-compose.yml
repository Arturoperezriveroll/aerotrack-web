services:
  aerotrack:
    build:
      context: .
    ports:
      - "${AEROTRACK_PORT:-8080}:80"
    environment:
      MAPBOX_ACCESS_TOKEN: "${MAPBOX_ACCESS_TOKEN:-}"
      MAPBOX_STYLE: "${MAPBOX_STYLE:-mapbox://styles/arturoriverol/clmofit4704je01ma2d8fblkr}"
      ADSB_RAPIDAPI_KEY: "${ADSB_RAPIDAPI_KEY:-}"
    volumes:
      - ./config.local.js:/opt/aerotrack/runtime-config.local.js:ro
    restart: unless-stopped
